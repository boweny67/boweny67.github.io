<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上肢康复混合辅助训练系统 — 汇报演示</title>
  <meta name="description" content="上肢康复混合辅助训练系统，25 页课堂汇报演示。">
  <meta name="theme-color" content="#14201C">
  <style>
    :root {
      --ink: #1B1D1B;
      --body: #4A4D48;
      --muted: #666A64;
      --line: #DAD3C5;
      --paper: #F5F1E8;
      --deep: #14201C;
      --green: #1F5A4D;
      --mint: #8CC3AE;
      --rust: #A64B18;
      --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    body {
      background-image:
        linear-gradient(90deg, rgba(31, 90, 77, .045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(31, 90, 77, .045) 1px, transparent 1px),
        linear-gradient(180deg, #FAF7F0 0%, #EDE7DA 100%);
      background-size: 44px 44px, 44px 44px, auto;
    }
    body.in-present { overflow: hidden; }
    button { font-family: inherit; }
    a { color: inherit; }

    .app { min-height: 100vh; padding: 16px 28px 22px; }
    .app:fullscreen { padding: 0; background: #07110E; overflow: hidden; }
    .app.in-present { position: fixed; inset: 0; z-index: 9999; min-height: 100dvh; padding: 0; background: #07110E; overflow: hidden; }

    .topbar {
      max-width: 1280px; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 40px;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .brand a { color: var(--green); font-size: 17px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .btn {
      min-height: 34px; border: 1px solid #C9C1B2; border-radius: 6px;
      padding: 5px 11px; background: rgba(255,255,255,.82); color: #3E4340;
      font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s, color .15s;
    }
    .btn:hover { border-color: var(--green); color: var(--green); }
    .btn:disabled { opacity: .42; cursor: default; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #F7F4EC; }
    .btn.primary:hover { background: #174438; color: #fff; }
    .btn.on { background: var(--deep); border-color: var(--deep); color: #F7F4EC; }

    .stage {
      position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9;
      margin: 0 auto; overflow: hidden; border-radius: 9px; background: var(--deep);
      border: 1px solid rgba(31,90,77,.2);
      box-shadow: 0 22px 60px rgba(20,32,28,.18);
      touch-action: pan-y;
    }
    .stage img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .app:fullscreen .topbar, .app:fullscreen .bottombar,
    .app.in-present .topbar, .app.in-present .bottombar {
      position: fixed; left: 0; right: 0; z-index: 50;
      max-width: none; margin: 0; padding: 8px 18px;
      background: rgba(245,241,232,.94); backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
    }
    .app:fullscreen .topbar, .app.in-present .topbar { top: 0; transform: translateY(-110%); }
    .app:fullscreen .bottombar, .app.in-present .bottombar { bottom: 0; transform: translateY(110%); }
    .app:fullscreen.show-top .topbar, .app.in-present.show-top .topbar,
    .app:fullscreen.show-bottom .bottombar, .app.in-present.show-bottom .bottombar {
      opacity: 1; pointer-events: auto; transform: translateY(0);
    }
    .app:fullscreen .stage, .app.in-present .stage {
      width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto;
      border: 0; border-radius: 0; box-shadow: none; background: #07110E;
    }
    .app:fullscreen .stage img, .app.in-present .stage img { width: 100%; height: 100%; object-fit: contain; }

    .bottombar {
      max-width: 1280px; margin: 12px auto 0;
      display: flex; align-items: center; gap: 14px;
    }
    .seek { flex: 1; accent-color: var(--green); cursor: pointer; }
    .counter { min-width: 64px; text-align: center; font-family: Consolas, "Courier New", monospace; font-size: 14px; color: var(--body); }

    .notes-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(390px, 92vw); z-index: 70;
      background: #FFFDF8; border-left: 1px solid var(--line);
      box-shadow: -16px 0 50px rgba(20,32,28,.16);
      padding: 30px 28px; overflow-y: auto;
      transform: translateX(102%); transition: transform .2s ease;
    }
    .notes-panel.open { transform: translateX(0); }
    .notes-panel h2 { margin: 0 0 6px; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 22px; }
    .notes-panel .label { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
    .notes-panel p { margin: 22px 0 0; font-size: 15px; line-height: 1.9; color: var(--body); white-space: pre-wrap; }

    .overview {
      position: fixed; inset: 0; z-index: 60; overflow-y: auto;
      background: rgba(20,32,28,.96); padding: 36px 28px 60px;
    }
    .overview[hidden], .notes-panel[hidden] { display: none; }
    .overview-inner { max-width: 1280px; margin: 0 auto; }
    .overview-head { display: flex; align-items: center; justify-content: space-between; color: #EDE7DA; margin-bottom: 22px; }
    .overview-head h2 { margin: 0; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 24px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .thumb {
      border: 2px solid transparent; border-radius: 6px; overflow: hidden; padding: 0;
      background: #0F1916; cursor: pointer; aspect-ratio: 16 / 9;
    }
    .thumb.is-active { border-color: var(--mint); }
    .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .thumb span { display: block; color: #C9D2CC; font-size: 11px; padding: 2px 0 0; font-family: Consolas, monospace; }

    @media print {
      @page { size: 1280px 720px; margin: 0; }
      html, body { background: #fff; }
      .app { padding: 0; min-height: 0; }
      .topbar, .bottombar, .notes-panel, .overview { display: none !important; }
      .stage { width: 1280px; height: 720px; max-width: none; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
    }
    @media (max-width: 640px) {
      .app { padding: 10px 12px 18px; }
      .brand span { display: none; }
      .brand a { font-size: 14px; }
      .btn { padding: 4px 8px; font-size: 12px; }
      .bottombar { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <a href="./index.html">上肢康复混合辅助训练系统</a>
        <span>课堂汇报 · 25 页 · 约 15 分钟</span>
      </div>
      <div class="controls">
        <button class="btn" id="overview-btn" type="button">目录</button>
        <button class="btn" id="notes" type="button">备注</button>
        <button class="btn" id="print" type="button">导出 PDF</button>
        <button class="btn primary" id="fullscreen" type="button">全屏</button>
      </div>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <img id="slide" alt="幻灯片" draggable="false">
    </section>

    <footer class="bottombar">
      <button class="btn" id="prev" type="button">上一页</button>
      <input class="seek" id="seek" type="range" min="1" max="25" value="1" aria-label="页码">
      <span class="counter" id="counter">1 / 25</span>
      <button class="btn" id="next" type="button">下一页</button>
    </footer>

    <aside class="notes-panel" id="notes-panel" hidden>
      <div class="label">演讲备注</div>
      <h2 id="notes-title">第 1 页</h2>
      <p id="notes-text"></p>
    </aside>

    <div class="overview" id="overview" hidden>
      <div class="overview-inner">
        <div class="overview-head">
          <h2>全部页面</h2>
          <button class="btn" id="close-overview" type="button">关闭</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </main>

  <script>
    const TOTAL = 25;
    const NOTES = ["各位老师、同学好，我们小组做的是一套上肢康复混合辅助训练系统，给脑卒中以后上肢偏瘫的患者用。 一句话说清它干什么：患者自己发力，机器在旁边补上差的那一点力。 下面用十五分钟把它讲一遍。", "今天讲四个部分。 先说我们为什么做这个系统，边界画在哪；再看它是怎么设计和拆分的，这部分最占时间；然后是需求和安全，这是医用设备绕不开的；最后落到具体场景，看看它在患者家里怎么跑、可能出什么事。", "第一部分，问题与定位。先说清楚我们做的是什么、不做什么。", "先说问题有多大。我国四十岁以上人群里，卒中现有患者一千两百多万；卒中后最常见的后遗症是对侧上肢偏瘫，急性期八成以上会出现，四成以上会长期留着。 卒中伤到的，主要是从大脑往下走的运动传导通路，肌肉和关节没坏，感觉和意图通常也还在。他不是不想动，是意图传不到手上。所以我们要做的是补上输出，不是另起一套替他动。", "系统的业务分三层，从下往上。最底下是基础业务，守住生命底线，训练全程体征不能出问题，它不追求效果，但上面两层都靠它。中间是原生业务，保护患者还剩下的感知和行动通路，不绕开它。最上面才是增强业务，补上抓握、伸展的缺口，它是叠加在患者主动发力上的，不是替代。右边四条是硬约束，后面每条需求都不能违反。", "第二部分，系统设计。先看信号怎么绕一圈，再看系统怎么一层层拆下去；拆到子系统和模块之后，还要交代两件事：算力放在哪，边界画到哪。这四页讲完，系统的骨架就立起来了。", "这张图是整套系统的骨架。前向链路：训练环境进来，感知分两轨，患者自己的残存神经和本体感觉是一轨，肌电电极、IMU 和力传感是另一轨；进混合决策单元融合、识别、仲裁；再分两路执行，一路走患者自己的神经，一路去外骨骼、电刺激和触觉反馈。绿线是反馈。右下的安全监护是旁路的，不串在主链路里。最上面是人，急停走硬线，不过软件。", "系统按六层拆，越往下范围越小，这条阶梯对应的是责任范围。任务层回答系统为什么存在；体系层是环境、人、机器咬成的闭环；整机层就是一个人穿戴上一套设备；再往下是六个功能系统、十九个子系统，最后是能采购、能贴片的模块，二十个硬件、十二个软件。分层不是为了分类，是为了出了问题能指着说，在这一层。", "第四层是系统，整机内部按功能分六个。关键在中间两列：每个系统，人体本来就有一套做法，机器又有一套，两套并行，不是机器把人的换掉。感知，人是皮肤和本体感受器，机器是肌电电极和 IMU；执行，人是骨骼肌，机器是外骨骼和电刺激。好处在最下面：任何一条通道降级，另一条还撑得住基础功能。", "六个系统还只是分工，再往下拆一层才是子系统，一共十九项。拆的标准很实际：要能画得出接口图，能单独拿出来测。比如决策与控制，拆成信号解扣、混合决策、预测控制三块，前一块的输出就是后一块的输入，哪一块出问题，定位得到。拆不到这个程度，出了问题只能说系统不好用，没法往下查。这一层也是后面需求分配和责任划分的落点。", "第二个架构决定是算力放哪。时间敏感的闭环，滤波、意图分类、安全规则、关节控制，全部留在本地边缘单元，不进网络。云端只做四件不急的事：日志汇总、模型更新、策略下发、远程复盘。这样断网了设备还能训练，急停也不用等网络往返。代价是本地算力要留余量，升级只能走配置下发，不能靠云端实时改策略。分工画清楚，延迟和断网这两件事才有解。", "第三个架构决定是范围。左边是系统包含的部分：采集、决策、执行、能源与监护、配置接口，一个闭环该有的都在里面。右边明确不做什么：不做诊断和治疗决策，那是医师的事；不做云端长期健康档案；也不交器件级的 BOM 和机械图纸。范围画清楚，需求才有落点。下面三方协同：治疗师设边界，患者日常用，技师负责校准和更换。辅助等级随康复进程调，不是一次设定终身不变。", "第三部分，需求与安全。先问清楚谁会用、他们真正要的是什么，再去想哪些地方会出事、出了事怎么兜住。", "写需求之前先问：谁会被影响，谁又能影响它。一共八类。标绿的五方是推动的，他们从系统里获益；标锈色的三方是审查的，职责是限制，诉求通常写成“不得”“必须”。影响力最高的是患者、监管、伦理和研发。这张表的用处是：后面每条需求都能指回这里某一行，指不回去的就可能是多做的。", "需求要写成能测的句子。“响应及时”不算，“意图识别端到端延迟不超过两百毫秒，不含机械动作，用时间戳测”才算。一共三十六条，左边挑了五条最硬的。右边是一条追溯链，从患者的诉求，到业务约束，到接口需求，到安全需求，最后落到一个硬件回路。正向能拆下去，反向也能走回来；找不到上游来源的条目，按多余实现删掉。", "安全这块我们反过来问：它会怎么伤人？用的是 STPA。先列六类损失，推出七个危险状态，再对每个控制器问四种问题：有没有给了不该给的动作，有没有该给的没给，顺序对不对，停得是不是太早或太晚。得到十二条不安全控制动作，每条反过来写成一条安全需求。看下面四条：置信度不够还在出力，力矩超限，监护看见了没切断，患者要退出被软件拦住。这里面没有一个零件是坏的。零件都好，人照样会受伤，所以安全不能只靠把零件做可靠。", "十二条安全需求最后收成四层防护。最外面是人在环，患者和治疗师随时接管；往里是决策层，置信度不够不出力，反馈超时冻结；再往里是执行层，力矩角度电流硬件限幅，越限直接切断；最底下是独立的安全监护，和主链路不共用供电、传感器、时钟和软件，主链路再怎么失效它还能独立切断输出。三条原则：失效默认安全，人的否决权最高，共因要隔离。", "第四部分，场景与边界。把系统放回患者家里，看一个真实的上午是怎么用的；也交代清楚，哪些条件下我们不让它用。", "第四部分，场景与边界。场景按四层由粗到细分：使命层是康复目标，它决定什么叫成功；环境层是诊室、社区站和家里，区别在监督强度；任务层是评估、被动、主动、抗阻；最下面交互层，把一次训练拆成可以观察的人机回合。上层约束下层，风险基本都在最下面这层定位。", "接下来划边界：什么范围内训练才允许开始，出了范围不是降强度，是不许开始。三个方向：适用人群，成年、单侧偏瘫、认知能配合，皮肤关节没问题，血压心率医师点头；场地设备，地面防滑、座椅稳固，阻抗合格、校准没过期；性能边界，力矩角度在限幅内，延迟两百毫秒、保护五十毫秒以内，单次不超过三十分钟。再看人：患者要警觉，治疗师不能离岗，家属知道急停在哪，但不能动阈值。", "系统有七种状态：自检待机，四个训练模式，还有告警降级和故障安全。看箭头的方向，所有异常只往下面走：先告警降级，提示、限制增强；没恢复就强制停机；主链路失效直接进故障安全，输出全断。要回来只有两条路：异常消除后人工确认，或者检修完复位。系统不会自己爬回训练模式。一句话，出了问题，只往少帮忙的方向退。", "放到一个具体的上午。患者五十八岁，右侧偏瘫三个月，Brunnstrom 四期，在家里客厅，家属在旁边，治疗师给过辅助等级。回合分五步：戴上自检；患者试着抬手去抓，置信度不够就只提示、不出力；仲裁后外骨骼把缺的那点力矩补上；反馈回采，监护一路盯着；次数到了或患者累了就停，退回安全位姿，记录留给治疗师复盘。成功看三条：轨迹平稳，没有过冲和痉挛，结束后没有新增不适。", "如果只记三句话，记这三句。 第一，立场：辅助不是替代。患者自己发力，机器只补差的那一点力，而且人随时能关掉它。 第二，结构：六层、六个系统、两条轨道。生物和人工两套做法并行，谁降级了另一套还撑得住；反射级的闭环留在本地。 第三，底线：失效默认无增强。坏了就停，而不是坏了还在跑；人的否决权最高，急停走硬线。", "最后交代这套系统现在做到哪一步。三条要承认的：还没有样机，现在是方案和架构层面的设计；STPA 和降级路径停在纸面，没做过故障注入；也没有伦理审批和患者数据。接下来：先把样机做出来；做越界注入，看是不是真按设计降级；最后过伦理再做小规模试用。", "我们的汇报到这里。一句话收尾：这套系统里，人不是被替换，是被扩展；前提是那条从意图到动作的线一直连着，而且人随时能自己剪断它。 谢谢，欢迎提问。"];
    const srcOf = (n) => `./assets/slides/slide-${String(n).padStart(2, '0')}.webp`;

    const app = document.getElementById('app');
    const stage = document.getElementById('stage');
    const img = document.getElementById('slide');
    const counter = document.getElementById('counter');
    const seek = document.getElementById('seek');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const notesBtn = document.getElementById('notes');
    const notesPanel = document.getElementById('notes-panel');
    const notesTitle = document.getElementById('notes-title');
    const notesText = document.getElementById('notes-text');
    const overview = document.getElementById('overview');
    const grid = document.getElementById('grid');
    const fullBtn = document.getElementById('fullscreen');

    let current = 0;
    let hideTimer;

    for (let i = 0; i < TOTAL; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'thumb';
      b.dataset.index = String(i);
      b.innerHTML = `<img src="${srcOf(i + 1)}" alt="第 ${i + 1} 页" loading="lazy"><span>${String(i + 1).padStart(2, '0')}</span>`;
      b.addEventListener('click', () => { show(i); closeOverview(); });
      grid.appendChild(b);
    }

    function indexFromHash() {
      const m = location.hash.match(/slide-(\d+)/);
      return m ? Math.min(Math.max(Number(m[1]) - 1, 0), TOTAL - 1) : 0;
    }

    function preload(n) {
      if (n < 1 || n > TOTAL) return;
      const p = new Image();
      p.src = srcOf(n);
    }

    function show(nextIndex) {
      current = Math.min(Math.max(nextIndex, 0), TOTAL - 1);
      img.src = srcOf(current + 1);
      img.alt = `第 ${current + 1} 页`;
      counter.textContent = `${current + 1} / ${TOTAL}`;
      seek.value = String(current + 1);
      prev.disabled = current === 0;
      next.disabled = current === TOTAL - 1;
      notesTitle.textContent = `第 ${current + 1} 页`;
      notesText.textContent = NOTES[current] || '';
      document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('is-active', i === current));
      history.replaceState(null, '', `#slide-${current + 1}`);
      preload(current - 1);
      preload(current + 1);
      preload(current + 2);
    }

    function isPresenting() {
      return document.fullscreenElement === app || app.classList.contains('in-present');
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (app.classList.contains('in-present')) {
        document.body.classList.remove('in-present');
        app.classList.remove('in-present', 'show-top', 'show-bottom');
      } else {
        try {
          await app.requestFullscreen({ navigationUI: 'hide' });
        } catch {
          document.body.classList.add('in-present');
          app.classList.add('in-present');
        }
      }
      syncFullBtn();
    }

    function syncFullBtn() {
      fullBtn.textContent = isPresenting() ? '退出全屏' : '全屏';
    }

    function toggleNotes() {
      const open = notesPanel.hidden;
      notesPanel.hidden = !open;
      notesBtn.classList.toggle('on', open);
    }

    function openOverview() { overview.hidden = false; }
    function closeOverview() { overview.hidden = true; }

    function handlePointer(event) {
      if (!isPresenting()) return;
      app.classList.toggle('show-top', event.clientY <= 84);
      app.classList.toggle('show-bottom', event.clientY >= innerHeight - 84);
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => app.classList.remove('show-top', 'show-bottom'), 1800);
    }

    let touchX = 0, touchY = 0, touchAt = 0;
    stage.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      if (!t) return;
      touchX = t.clientX; touchY = t.clientY; touchAt = Date.now();
    }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - touchX, dy = t.clientY - touchY;
      if (Date.now() - touchAt > 900 || Math.abs(dx) < 52 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      show(current + (dx < 0 ? 1 : -1));
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(current + 1); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(current - 1); }
      if (e.key === 'Home') { e.preventDefault(); show(0); }
      if (e.key === 'End') { e.preventDefault(); show(TOTAL - 1); }
      if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
      if (e.key.toLowerCase() === 'n') { e.preventDefault(); toggleNotes(); }
      if (e.key.toLowerCase() === 'o') { e.preventDefault(); overview.hidden ? openOverview() : closeOverview(); }
      if (e.key === 'Escape') { closeOverview(); }
    });

    prev.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));

    // 演示状态下点击舞台：右半屏后翻一页，左半屏前翻一页
    stage.addEventListener('click', (e) => {
      if (!isPresenting()) return;
      if (e.clientX >= window.innerWidth / 2) show(current + 1);
      else show(current - 1);
    });
    seek.addEventListener('input', () => show(Number(seek.value) - 1));
    notesBtn.addEventListener('click', toggleNotes);
    document.getElementById('overview-btn').addEventListener('click', openOverview);
    document.getElementById('close-overview').addEventListener('click', closeOverview);
    document.getElementById('print').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      document.body.classList.remove('in-present');
      app.classList.remove('in-present');
      setTimeout(() => window.print(), 120);
    });
    fullBtn.addEventListener('click', toggleFullscreen);
    app.addEventListener('pointermove', handlePointer);
    document.addEventListener('fullscreenchange', syncFullBtn);
    window.addEventListener('hashchange', () => show(indexFromHash()));

    show(indexFromHash());
    syncFullBtn();
  </script>
</body>
</html>
