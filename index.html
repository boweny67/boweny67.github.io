<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨博文 | 作业展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fafafa;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        header {
            margin-bottom: 60px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
        }
        .meta {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #888;
        }
        .meta span::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4f46e5;
            margin-right: 8px;
            vertical-align: middle;
        }
        section {
            margin-bottom: 48px;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e5e5;
        }
        .assignment-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .assignment-item {
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .assignment-item:hover {
            border-color: #4f46e5;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.1);
        }
        .assignment-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .assignment-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .assignment-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            color: #999;
            font-size: 0.85rem;
        }
        a {
            color: #4f46e5;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>杨博文</h1>
            <p class="subtitle">吉林大学 · 作业展示主页</p>
            <div class="meta">
                <span>GitHub: boweny67</span>
                <span>更新于 2026-11-07</span>
            </div>
        </header>

        <section>
            <h2>课程作业</h2>
            <div class="assignment-list">
                <a href="assignment1/" class="assignment-item">
                    <div class="assignment-title">小组作业 1：机器增强的人机混合神经系统</div>
                    <p class="assignment-desc">围绕"机器增强的人机混合神经系统"，拆解任务-体系-整机-系统-子系统-模块六层架构。</p>
                    <span class="assignment-tag">系统工程</span>
                </a>
            </div>
        </section>

        <section>
            <h2>关于我</h2>
            <p style="color: #555;">
                吉林大学在读学生，这里是我的课程作业展示页面。所有作业均通过 GitHub 提交，欢迎老师查看。
            </p>
        </section>

        <footer>
            <p>由 <a href="https://github.com/boweny67">boweny67</a> 制作 · Powered by GitHub Pages</p>
        </footer>
    </div>
</body>
</html>
